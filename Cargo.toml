[package]
name = "rshell"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35"
egui = "0.35"
egui_extras = "0.35"
epaint = "0.35"
tokio = { version = "1", features = ["full"] }
russh = "0.62"
russh-sftp = "2.3"
alacritty_terminal = "0.26"
portable-pty = "0.9"
sysinfo = "0.39"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
directories = "6"
fontdb = "0.23"
anyhow = "1"
rfd = "0.17"
keyring = "4"
rand = "0.10"
argon2 = "0.5"
aes-gcm = { version = "0.11", features = ["getrandom"] }
base64 = "0.22"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
env_logger = "0.11"
log = "0.4"
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot", "eframe"] }

[profile.release]
opt-level = 2
