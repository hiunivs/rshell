name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Monotonically increasing build number (1-65535)
        required: true
        type: number
      macos_appcast_url:
        description: Stable macOS appcast HTTPS URL
        required: true
        default: https://github.com/hiunivs/rshell/releases/download/stable/appcast.xml
        type: string
      macos_beta_appcast_url:
        description: Optional beta macOS appcast HTTPS URL
        required: false
        type: string
      macos_release_channel:
        description: macOS appcast artifact channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      windows_update_base_url:
        description: Stable Windows update HTTPS directory
        required: true
        default: https://github.com/hiunivs/rshell/releases/download/stable
        type: string
      windows_beta_update_base_url:
        description: Optional beta Windows update HTTPS directory
        required: false
        type: string
      windows_release_channel:
        description: Windows artifact channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      windows_publisher:
        description: Exact MSIX certificate subject, for example CN=RShell
        required: true
        type: string
      windows_publisher_display_name:
        description: Publisher name shown by App Installer
        required: true
        default: RShell
        type: string
      publish:
        description: Publish artifacts to GitHub Releases after building
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  licenses:
    name: Verify release source and licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the version tag at HEAD
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          EXPECTED_TAG="v$VERSION"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")" ]]
      - name: Install pinned license-report generator
        shell: bash
        run: cargo install --locked --version 0.9.1 --features cli cargo-about
      - name: Verify locked dependency licenses and committed report
        shell: bash
        run: |
          set -euo pipefail
          cargo about generate --locked --fail \
            --config about.toml \
            --output-file THIRD_PARTY_LICENSES.html \
            about.hbs
          git diff --exit-code -- THIRD_PARTY_LICENSES.html

  macos:
    name: macOS universal (signed, notarization optional)
    needs: licenses
    runs-on: macos-15
    environment: release
    env:
      RSHELL_BUILD_NUMBER: ${{ inputs.build_number }}
      RSHELL_MACOS_APPCAST_URL: ${{ inputs.macos_appcast_url }}
      RSHELL_MACOS_BETA_APPCAST_URL: ${{ inputs.macos_beta_appcast_url }}
      RSHELL_MACOS_RELEASE_CHANNEL: ${{ inputs.macos_release_channel }}
      RSHELL_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      RSHELL_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      SPARKLE_VERSION: ${{ vars.SPARKLE_VERSION }}
      SPARKLE_SHA256: ${{ vars.SPARKLE_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust targets
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RSHELL_MACOS_APPCAST_URL" == https://*/appcast.xml ]]
          if [[ "$RSHELL_MACOS_RELEASE_CHANNEL" == beta ]]; then
            [[ "$RSHELL_MACOS_BETA_APPCAST_URL" == https://*/appcast.xml ]]
          fi
          [[ -n "$SPARKLE_VERSION" ]]
          [[ "$SPARKLE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ -n "$RSHELL_SPARKLE_PUBLIC_KEY" ]]
          [[ -n "$RSHELL_MACOS_SIGN_IDENTITY" ]]

      - name: Download and verify pinned Sparkle distribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --output "$RUNNER_TEMP/Sparkle.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/Sparkle"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/Sparkle"
          test -d "$RUNNER_TEMP/Sparkle/Sparkle.framework"
          test -x "$RUNNER_TEMP/Sparkle/bin/generate_appcast"
          test -f "$RUNNER_TEMP/Sparkle/LICENSE"
          echo "SPARKLE_FRAMEWORK_PATH=$RUNNER_TEMP/Sparkle/Sparkle.framework" >> "$GITHUB_ENV"
          echo "SPARKLE_LICENSE_PATH=$RUNNER_TEMP/Sparkle/LICENSE" >> "$GITHUB_ENV"
          echo "SPARKLE_BIN_DIR=$RUNNER_TEMP/Sparkle/bin" >> "$GITHUB_ENV"

      - name: Import release credentials into temporary keychain
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/rshell-release.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/rshell-release.p12"
          SPARKLE_KEY="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$CERTIFICATE"
          printf '%s' "$SPARKLE_PRIVATE_KEY_BASE64" | openssl base64 -d -A -out "$SPARKLE_KEY"
          chmod 600 "$SPARKLE_KEY"
          security create-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RELEASE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN"
          # The Sparkle private key stays a file: generate_appcast reads it via
          # --ed-key-file, so no interactive Keychain ACL prompt can hang CI.
          echo "RSHELL_RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "RSHELL_SPARKLE_PRIVATE_KEY_FILE=$SPARKLE_KEY" >> "$GITHUB_ENV"

      - name: Build and sign macOS app
        shell: bash
        run: ./packaging/macos/package.sh

      - name: Generate signed channel appcast
        shell: bash
        env:
          INPUT_MACOS_RELEASE_CHANNEL: ${{ inputs.macos_release_channel }}
          INPUT_MACOS_STABLE_APPCAST_URL: ${{ inputs.macos_appcast_url }}
          INPUT_MACOS_BETA_APPCAST_URL: ${{ inputs.macos_beta_appcast_url }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_MACOS_RELEASE_CHANNEL" == beta ]]; then
            FEED_URL="$INPUT_MACOS_BETA_APPCAST_URL"
          else
            FEED_URL="$INPUT_MACOS_STABLE_APPCAST_URL"
          fi
          [[ "$FEED_URL" == https://*/appcast.xml ]]
          RSHELL_MACOS_DOWNLOAD_PREFIX="${FEED_URL%/appcast.xml}"
          export RSHELL_MACOS_DOWNLOAD_PREFIX
          ./packaging/macos/generate_appcast.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rshell-macos-${{ inputs.macos_release_channel }}-${{ inputs.build_number }}
          path: |
            dist/macos/RShell-*.zip
            dist/macos/appcast.xml
            dist/macos/*.delta
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary release keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${RSHELL_RELEASE_KEYCHAIN:-}" && -f "$RSHELL_RELEASE_KEYCHAIN" ]]; then
            security default-keychain -d user -s login.keychain-db
            security delete-keychain "$RSHELL_RELEASE_KEYCHAIN"
          fi

  windows:
    name: Windows x64 (signed MSIX)
    needs: licenses
    runs-on: windows-2025
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Decode signing certificate
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) { throw "WINDOWS_PFX_BASE64 is required" }
          $Path = Join-Path $env:RUNNER_TEMP "rshell-release.pfx"
          [IO.File]::WriteAllBytes($Path, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          "RSHELL_WINDOWS_PFX_PATH=$Path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, sign and verify Windows package
        shell: pwsh
        env:
          RSHELL_WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_PUBLISHER: ${{ inputs.windows_publisher }}
          INPUT_PUBLISHER_DISPLAY_NAME: ${{ inputs.windows_publisher_display_name }}
          INPUT_UPDATE_BASE_URL: ${{ inputs.windows_update_base_url }}
          INPUT_BETA_UPDATE_BASE_URL: ${{ inputs.windows_beta_update_base_url }}
          INPUT_RELEASE_CHANNEL: ${{ inputs.windows_release_channel }}
        run: |
          $Parameters = @{
            Architecture = "x64"
            BuildNumber = [int]$env:INPUT_BUILD_NUMBER
            Publisher = $env:INPUT_PUBLISHER
            PublisherDisplayName = $env:INPUT_PUBLISHER_DISPLAY_NAME
            UpdateBaseUrl = $env:INPUT_UPDATE_BASE_URL
            ReleaseChannel = $env:INPUT_RELEASE_CHANNEL
          }
          if ($env:INPUT_BETA_UPDATE_BASE_URL) {
            $Parameters.BetaUpdateBaseUrl = $env:INPUT_BETA_UPDATE_BASE_URL
          }
          ./packaging/windows/package.ps1 @Parameters

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rshell-windows-${{ inputs.windows_release_channel }}-${{ inputs.build_number }}
          path: |
            dist/windows/${{ inputs.windows_release_channel }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GitHub Releases
    if: inputs.publish
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MACOS_CHANNEL: ${{ inputs.macos_release_channel }}
      WINDOWS_CHANNEL: ${{ inputs.windows_release_channel }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download build artifacts
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --name "rshell-macos-$MACOS_CHANNEL-$BUILD_NUMBER" --dir artifacts/macos
          gh run download "$GITHUB_RUN_ID" \
            --name "rshell-windows-$WINDOWS_CHANNEL-$BUILD_NUMBER" --dir artifacts/windows

      - name: Create the versioned release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "RShell $VERSION" --generate-notes
          fi

      - name: Upload immutable versioned assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          MACOS_ZIP="$(find artifacts/macos -name "RShell-$VERSION-macos-universal.zip" -print -quit)"
          MSIX="$(find artifacts/windows -name "RShell-$VERSION-windows-*.msixbundle" -print -quit)"
          : "${MACOS_ZIP:?}"; : "${MSIX:?}"
          # No --clobber here: re-publishing a different binary under an existing
          # version must fail instead of silently replacing released assets.
          # GitHub's automatic per-tag source snapshots serve as the
          # corresponding source for these binaries.
          gh release upload "$TAG" "$MACOS_ZIP" "$MSIX"

      - name: Update channel releases used by auto-update
        shell: bash
        run: |
          set -euo pipefail
          APPCAST="$(find artifacts/macos -name appcast.xml -print -quit)"
          APPINSTALLER="$(find artifacts/windows -name RShell.appinstaller -print -quit)"
          MACOS_ZIP="$(find artifacts/macos -name "RShell-$VERSION-macos-universal.zip" -print -quit)"
          MSIX="$(find artifacts/windows -name "RShell-$VERSION-windows-*.msixbundle" -print -quit)"
          : "${APPCAST:?}"; : "${APPINSTALLER:?}"; : "${MACOS_ZIP:?}"; : "${MSIX:?}"
          for CHANNEL in "$MACOS_CHANNEL" "$WINDOWS_CHANNEL"; do
            if ! gh release view "$CHANNEL" >/dev/null 2>&1; then
              gh release create "$CHANNEL" \
                --title "RShell $CHANNEL channel" \
                --notes "Auto-update metadata and the latest $CHANNEL packages. Do not edit appcast.xml or RShell.appinstaller by hand."
            fi
          done
          # appcast.xml / RShell.appinstaller are stable-URL manifests and are
          # replaced atomically only after the versioned release assets exist.
          gh release upload "$MACOS_CHANNEL" "$MACOS_ZIP"
          gh release upload "$MACOS_CHANNEL" --clobber "$APPCAST"
          gh release upload "$WINDOWS_CHANNEL" "$MSIX"
          gh release upload "$WINDOWS_CHANNEL" --clobber "$APPINSTALLER"
