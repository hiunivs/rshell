# Licenses accepted for bundled dependencies. For an OR expression,
# cargo-about selects the first satisfiable option from this list.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]

ignore-build-dependencies = false
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]

# RShell itself is documented by LICENSE and NOTICE, not the generated
# third-party report.
private = { ignore = true }
